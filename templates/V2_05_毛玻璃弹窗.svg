  </g>
  <rect width="1280" height="720" fill="#1A1A1A" opacity="0.18"/>
  <!-- center popup card -->
  <g filter="url(#sh5)">
    <rect x="360" y="160" width="560" height="400" fill="#FFFFFF"/>
  </g>
  <rect x="392" y="196" width="150" height="40" fill="#111318"/>
