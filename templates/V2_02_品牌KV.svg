<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots2" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#F2C14E"/></pattern>
    <linearGradient id="tex2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13233C"/><stop offset="1" stop-color="#0D1626"/></linearGradient>
    <clipPath id="xclip2"><polygon points="120,-40 300,-40 640,420 560,500"/><polygon points="640,-40 460,-40 120,420 200,500"/></clipPath>
  </defs>
  <!-- left KV zone -->
  <rect x="0" y="0" width="800" height="720" fill="url(#tex2)"/>
  <!-- giant cropped white geometry (abstract X) -->
  <g fill="#F4F6F8">
    <polygon points="120,-40 300,-40 640,420 560,500"/>
    <polygon points="640,-40 460,-40 120,420 200,500"/>
    <rect x="80" y="560" width="180" height="26"/>
    <rect x="80" y="606" width="120" height="12" opacity="0.85"/>
  </g>
  <!-- texture band (glacier-like) -->
  <rect x="0" y="480" width="800" height="60" fill="#1E9AA8" opacity="0.35"/>
  <rect x="0" y="528" width="800" height="24" fill="#1E9AA8" opacity="0.18"/>
  <!-- halftone dots -->
  <rect x="60" y="180" width="130" height="90" fill="url(#dots2)" opacity="0.85"/>
  <!-- slogan（与白色几何交叠处反色为深，clipPath 实现） -->
  <text x="80" y="440" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="900" fill="#F4F6F8" letter-spacing="-1">NO LIMIT OF</text>
  <g clip-path="url(#xclip2)">
    <text x="80" y="440" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="900" fill="#0D1626" letter-spacing="-1">NO LIMIT OF</text>
  </g>
  <g stroke="#F4F6F8" stroke-width="3" fill="none">
    <path d="M96,652 L96,684 M82,668 L110,668 M86,656 L106,680 M106,656 L86,680"/>
    <path d="M150,660 L164,660 L158,676 Z M164,660 L178,660 L172,676 Z"/>
    <path d="M206,668 L216,656 L226,668 L236,656 L246,668 L256,656"/>
  </g>
  <!-- right info panel -->
  <rect x="800" y="0" width="480" height="720" fill="#F4F5F6"/>
  <g font-family="'Noto Serif SC','Times New Roman',serif" fill="#111318">
    <text x="840" y="120" font-size="52" font-weight="700" letter-spacing="4">SPARK</text>
    <line x1="840" y1="140" x2="1064" y2="140" stroke="#111318" stroke-width="2"/>
    <text x="840" y="168" font-size="14" letter-spacing="6">COGNITION SERIES</text>
  </g>
  <rect x="840" y="204" width="128" height="36" fill="#111318"/>
  <text x="856" y="228" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#F4F6F8">星火 X2.5</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3A3E46">
    <text x="840" y="292">新一代认知大模型。</text>
    <text x="840" y="318">在跨模态理解、长文推理与响应</text>
    <text x="840" y="340">速度三个方向同步升级，</text>
    <text x="840" y="362">面向复杂任务场景发布。</text>
  </g>
  <line x1="840" y1="400" x2="1240" y2="400" stroke="#C9CCD1" stroke-width="1"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6A6F78">
    <text x="840" y="432">版本</text><text x="1240" y="432" text-anchor="end">X2.5</text>
    <line x1="840" y1="448" x2="1240" y2="448" stroke="#DDDFE2" stroke-width="1"/>
    <text x="840" y="478">上下文</text><text x="1240" y="478" text-anchor="end">128K</text>
    <line x1="840" y1="494" x2="1240" y2="494" stroke="#DDDFE2" stroke-width="1"/>
    <text x="840" y="524">发布</text><text x="1240" y="524" text-anchor="end">SPEC 01</text>
  </g>
  <!-- bottom logo -->
  <g transform="translate(840,610)">
    <polygon points="18,0 36,10 36,30 18,40 0,30 0,10" fill="none" stroke="#111318" stroke-width="2.5"/>
    <path d="M18,12 L18,28 M10,20 L26,20" stroke="#111318" stroke-width="2.5"/>
    <text x="56" y="30" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#111318" letter-spacing="2">讯飞星火</text>
  </g>
</svg>
